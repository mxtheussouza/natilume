services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: natilume
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: natilume
    ports:
      - "127.0.0.1:56432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U natilume -d natilume"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
